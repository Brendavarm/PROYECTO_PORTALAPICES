# Render.com — Web Service (carpeta backend como root en el panel)
services:
  - type: web
    name: goaldesk-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
